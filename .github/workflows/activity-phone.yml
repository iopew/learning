name: ActivityTracker iPhone

# Builds the iPhone app (unsigned: it is signed on the owner's Mac by Xcode with their Apple ID). Nothing is
# published: the app is installed from Xcode.
on:
  push:
    paths:
      - "ActivityTracker/Phone/**"
      - "ActivityTracker/Sources/ActivityCore/**"
      - "ActivityTracker/Package.swift"
      - ".github/workflows/activity-phone.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: activity-phone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: ActivityTracker/Phone
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Toolchain
        run: xcodebuild -version

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project ActivityPhone.xcodeproj -scheme ActivityPhone -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || {
              grep -E "error:|error\b" build.log | sort -u | head -n 100
              tail -n 60 build.log
              exit 1
            }
          grep -E "warning:" build.log | sort -u | head -n 60 || true

      - name: Check the app bundle
        run: |
          APP=build/Build/Products/Debug-iphoneos/ActivityPhone.app
          plutil -lint "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSBonjourServices' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
          test -f "$APP/Assets.car"
